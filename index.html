<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        input { width: 90%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; margin-bottom: 15px; }
        button { width: 95%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .options { margin: 15px 0; display:flex; justify-content:center; gap:20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>YouTube Video Downloader</h2>
        <p>download YouTube videos, convert YouTube to mp3</p>
        <form action="/download" method="POST">
            <input type="text" name="url" placeholder="Paste YouTube link here" required>
            <div class="options">
                <label><input type="radio" name="format" value="mp4" checked> MP4 Video</label>
                <label><input type="radio" name="format" value="mp3"> MP3 Audio</label>
            </div>
            <button type="submit">Download Here</button>
        </form>
    </div>
</body>

></html>
